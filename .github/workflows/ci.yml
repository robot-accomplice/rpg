name: CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Run tests
        run: cargo test --verbose
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Code coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-tarpaulin
          cargo tarpaulin --tests --out Xml --output-dir coverage
      - name: Upload to codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        run: cargo build --release --verbose
      - name: Check package
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --allow-dirty
      - name: Check publish
        if: matrix.os == 'ubuntu-latest'
        run: cargo publish --dry-run --allow-dirty

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rpg
            suffix: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: rpg
            suffix: linux-arm64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rpg
            suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: rpg
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rpg.exe
            suffix: windows-x86_64.exe
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64 cross-compilation toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Compute versioned asset name
        id: asset
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          echo "name=rpg-${GITHUB_REF_NAME}-${SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Rename and checksum (Unix)
        if: matrix.os != 'windows-latest'
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          cd target/${{ matrix.target }}/release
          cp "${{ matrix.artifact }}" "$ASSET_NAME"
          shasum -a 256 "$ASSET_NAME" > "$ASSET_NAME.sha256"
      - name: Rename and checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          cd target/${{ matrix.target }}/release
          Copy-Item ${{ matrix.artifact }} $env:ASSET_NAME
          $hash = (Get-FileHash $env:ASSET_NAME -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET_NAME" | Out-File -Encoding utf8 -NoNewline "$env:ASSET_NAME.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/${{ steps.asset.outputs.name }}
            target/${{ matrix.target }}/release/${{ steps.asset.outputs.name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
